<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene Lens</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-screen="home">
    <!-- Shared header: identical on every screen (grid contract: docs/grid.md) -->
    <header class="site-header">
      <div class="grid">
        <span class="brand">Scene Lens</span>
        <button class="link back" id="back-home"><span class="icon" data-icon="arrow-left" aria-hidden="true"></span><span data-i18n="back"></span></button>
        <span class="status" id="status"></span>
        <div class="lang" role="group" aria-label="Language">
          <button id="lang-ko" data-lang="ko" class="on">한국어</button>
          <button id="lang-en" data-lang="en">English</button>
        </div>
      </div>
    </header>

    <!-- Screen 1: start page -->
    <div id="home">
      <section class="hero grid">
        <h1>Scene Lens</h1>
        <p class="lead" data-i18n="home.lead"></p>
        <div class="choices">
          <label class="btn big"><span class="icon" data-icon="image" aria-hidden="true"></span><span data-i18n="home.photo"></span><input id="file-img" type="file" accept="image/*" hidden /></label>
          <label class="btn big"><span class="icon" data-icon="video" aria-hidden="true"></span><span data-i18n="home.video"></span><input id="file-vid" type="file" accept="video/*" hidden /></label>
          <button class="btn big" id="cam"><span class="icon" data-icon="camera" aria-hidden="true"></span><span data-i18n="home.camera"></span></button>
        </div>
        <p class="hint" id="home-msg"></p>
        <a class="scroll" href="#about" data-i18n="home.scroll"></a>
      </section>
      <section class="about grid" id="about">
        <h2 data-i18n="about.title"></h2>
        <p class="big-text" data-i18n="about.text"></p>
        <div class="steps">
          <article><span>01</span><h3 data-i18n="step.detect"></h3><p data-i18n="step.detect.text"></p></article>
          <article><span>02</span><h3 data-i18n="step.count"></h3><p data-i18n="step.count.text"></p></article>
          <article><span>03</span><h3 data-i18n="step.deeper"></h3><p data-i18n="step.deeper.text"></p></article>
          <article><span>04</span><h3 data-i18n="step.understand"></h3><p data-i18n="step.understand.text"></p></article>
        </div>
        <p class="fine" data-i18n="about.fine"></p>
      </section>
    </div>

    <!-- Screen 2: analysis -->
    <div id="analysis" hidden>
      <main class="workspace grid">
        <section class="left">
          <div class="stage" id="stage">
            <img id="img" hidden alt="" />
            <video id="vid" hidden playsinline muted></video>
            <canvas id="overlay"></canvas>
          </div>
          <div class="controls" id="controls">
            <button class="btn" id="back" data-i18n-title="ctl.back.title"><span class="icon" data-icon="backward" aria-hidden="true"></span><span data-i18n="ctl.back"></span></button>
            <button class="btn" id="play"><span class="icon" data-icon="pause" id="play-icon" aria-hidden="true"></span><span id="play-text"></span></button>
            <button class="btn" id="fwd" data-i18n-title="ctl.fwd.title"><span data-i18n="ctl.fwd"></span><span class="icon" data-icon="forward" aria-hidden="true"></span></button>
            <button class="btn ghost" id="reset" data-i18n-title="ctl.reset.title"><span class="icon" data-icon="arrow-rotate-left" aria-hidden="true"></span><span data-i18n="ctl.reset"></span></button>
            <input id="seek" type="range" min="0" max="1000" value="0" data-i18n-aria="ctl.timeline" />
            <span class="time" id="time">0:00</span>
            <button class="btn ghost" id="switch-cam" hidden><span class="icon" data-icon="camera-rotate" aria-hidden="true"></span><span data-i18n="ctl.switch"></span></button>
          </div>
        </section>
        <aside class="right">
          <details class="settings" id="settings">
            <summary><h2><span class="icon" data-icon="gear" aria-hidden="true"></span><span data-i18n="set.title"></span></h2></summary>
            <label class="switch"><input type="checkbox" id="faces-on" /><span class="track"></span><span data-i18n="set.faces"></span></label>
            <p class="note" data-i18n="people.note"></p>
            <div class="conf"><label for="thr"><span data-i18n="set.conf"></span> <b id="thr-val">65 %</b></label><input id="thr" type="range" min="20" max="90" value="65" /></div>
          </details>
          <section>
            <h2 data-i18n="counts.title"></h2>
            <div class="counts-box" tabindex="0">
              <div class="tabs"><span class="tag" data-i18n="counts.total"></span><span class="tag" data-i18n="counts.now"></span></div>
              <ul class="counts" id="counts"></ul>
            </div>
          </section>
          <section>
            <h2 data-i18n="sug.title"></h2>
            <div id="scene" class="scene muted"></div>
          </section>
          <div class="actions">
            <button class="btn wide" id="open-cmp" data-i18n="cmp.open"></button>
            <button class="btn ghost wide" id="open-tm" data-i18n="tm.open"></button>
          </div>
        </aside>
      </main>
    </div>

    <!-- Comparison popup: the analysed counts against the typical counts of a chosen scene -->
    <div id="cmp" class="modal grid" hidden>
      <div class="panel" id="cmp-panel" tabindex="-1" role="dialog" aria-labelledby="cmp-title">
        <button id="cmp-close" class="close" data-i18n-aria="tm.close">×</button>
        <h2 id="cmp-title" data-i18n="cmp.title"></h2>
        <div class="seg" id="cmp-scenes" role="group" data-i18n-aria="cmp.choose"></div>
        <div id="compare"></div>
      </div>
    </div>

    <!-- Treemap overlay -->
    <div id="tm" class="modal" hidden>
      <div class="panel" id="tm-panel" tabindex="-1" role="dialog">
        <button id="tm-close" class="close" data-i18n-aria="tm.close">×</button>
        <h2 data-i18n="tm.title"></h2>
        <div class="seg"><button id="tm-total" class="on" data-i18n="tm.total"></button><button id="tm-cur" data-i18n="tm.current"></button></div>
        <div id="tm-map"></div>
      </div>
      <div id="tm-tip" role="tooltip" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
